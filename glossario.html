function slug(s){ return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""); }
function ini(s){ var c = s.charAt(0).toUpperCase(); return c; }
function render(filter){
  var f = (filter || "").toLowerCase().trim();
  var list = T.filter(function(t){ return !f || (t[0] + " " + t[1]).toLowerCase().indexOf(f) !== -1; });
  var out = "", cur = "";
  list.forEach(function(t){
    var c = ini(t[0]);
    if (c !== cur) { if (cur) out += "</dl>"; out += '<h2 id="l-' + c + '">' + c + "</h2><dl>"; cur = c; }
    var id = slug(t[0]), ln = LINK[t[0]];
    out += '<div id="t-' + id + '"><dt>' + t[0] + "<small>" + (t[2] === "Corso" || t[2] === "Approfondimento" ? t[2] : "Lezione " + t[2]) + "</small></dt><dd>" + t[1] +
      (ln ? ' <a class="gl-go" data-t="' + id + '" data-n="' + t[0].replace(/"/g, "") + '" href="lezione-' + ln[0] + ".html#" + ln[1] + '">Vai alla slide: Lezione ' + ln[0] + ", slide " + ln[1] + " &rarr;</a>" : "") + "</dd></div>";
  });
  if (cur) out += "</dl>";
  document.getElementById("gl").innerHTML = out || "<p>Nessun termine trovato.</p>";
  document.getElementById("cnt").textContent = list.length + " di " + T.length + " termini";
  var letters = {};
  list.forEach(function(t){ letters[ini(t[0])] = 1; });
  document.getElementById("az").innerHTML = Object.keys(letters).map(function(l){ return '<a href="#l-' + l + '">' + l + "</a>"; }).join("");
}

document.getElementById("gl").addEventListener("click", function (e) {
  var a = e.target.closest ? e.target.closest(".gl-go") : null;
  if (!a) return;
  try { sessionStorage.setItem("da", JSON.stringify({ t: a.getAttribute("data-t"), n: a.getAttribute("data-n") })); } catch (err) {}
});

  var h = (window.__glossHash || location.hash || "").replace("#", "");
  try { sessionStorage.removeItem("da"); } catch (e) {}

  if (el) { el.classList.add("hl"); el.scrollIntoView({ block: "center" }); }
})();
