  <h1 style="margin-top:20px">Glossario</h1>
  <p class="lead mute" style="margin-top:8px">Tutti i termini usati nel corso, in ordine alfabetico, con la lezione in cui compaiono.</p>

    <input id="q" type="search" placeholder="Cerca un termine" aria-label="Cerca un termine">

<footer class="sitefoot"><span>Pietro Votano Avolio</span><span>AI e Metodo di Studio</span></footer>
<script>
var T = [
["Assistente IA","Programma che risponde a richieste in linguaggio naturale, una alla volta, e svolge compiti. Può essere generalista (Gemini) o specializzato (NotebookLM, un Gem). Diverso dall'agente, che persegue un obiettivo in più passi.","1"],
["Assistente generalista e specializzato","Generalista: adatto a molti compiti. Specializzato: configurato per uno scopo, come un tutor di Matematica o uno strumento che lavora solo sulle tue fonti.","1"],
["ChatGPT","Assistente generalista di OpenAI, con assistenti personalizzabili (GPT).","1"],
["Claude","Assistente generalista di Anthropic, con progetti e artefatti interattivi.","1"],
["Microsoft Copilot","Assistente di Microsoft, integrato in Windows e in Microsoft 365.","1"],
["Perplexity","Motore di risposta che cita le fonti web.","1"],
["Le Chat (Mistral)","Assistente generalista dell'azienda europea Mistral AI.","1"],
["Agente","Sistema che riceve un obiettivo, pianifica i passi e li esegue usando strumenti (cercare, leggere, scrivere), con un certo grado di autonomia. Diverso dall'assistente, che risponde a una richiesta alla volta.","1"],
["Automation bias","Tendenza a fidarsi troppo dell'output di un sistema automatico, soprattutto se appare ordinato e sicuro.","1"],
["Catena di pensiero (chain of thought)","Tecnica che chiede al modello di ragionare passo per passo. I passaggi vanno controllati: non sono una prova.","1"],
["Contenuto sintetico / deepfake","Immagine, audio o video creati dall'IA. Il deepfake imita persone reali in modo verosimile.","5"],
["Data di addestramento (knowledge cutoff)","Data oltre la quale il modello non ha informazioni, se non ne cerca di nuove.","1"],
["Delega cognitiva (cognitive offloading)","Affidare a uno strumento un'attività mentale. Danneggia quando riguarda proprio la competenza da allenare.","1"],
["Difficoltà desiderabili","Un po' di sforzo durante lo studio rende l'apprendimento più duraturo.","4"],
["Effetto generazione","Si ricorda meglio ciò che si è provato a produrre prima di vedere la risposta.","4"],
["Fine-tuning","Riaddestramento di un modello su dati aggiuntivi. Non serve per l'uso didattico quotidiano.","3"],
["GDPR","Regolamento europeo sulla protezione dei dati personali: richiede particolare cautela con i dati degli studenti.","1"],
["Human-in-the-Loop","Principio per cui una persona resta nel ciclo di lavoro: guida, verifica e decide prima che un output venga usato.","1"],
["IA generativa","Sistemi che creano contenuti nuovi: testi, immagini, audio, codice.","1"],
["Illusione di padronanza","Sensazione di sapere già una cosa perché il testo è chiaro e scorrevole. Si smaschera richiamando senza guardare.","4"],
["In / on / out of the loop","Tre livelli di controllo: la persona approva ogni output, supervisiona e interviene, oppure non controlla (sconsigliato a scuola).","1"],
["Interleaving","Alternare argomenti o tipi di problema invece di studiarli a blocchi.","4"],
["Jailbreak","Tentativo di far ignorare al modello le sue regole con richieste costruite ad arte.","6"],
["Lettura laterale","Verificare una fonte aprendo altre schede per capire chi la pubblica e cosa dicono fonti indipendenti.","5"],
["Lost in the middle","Tendenza dei modelli a usare meglio le informazioni all'inizio e alla fine di un testo lungo che quelle nel mezzo.","1"],
["Metaprompt","Prompt in cui si chiede all'IA di migliorare o valutare un altro prompt.","1"],
["Modello di ragionamento","Modello che elabora più passaggi intermedi prima di rispondere, utile su problemi articolati.","1"],
["Pattern (schema)","Regolarità statistica del linguaggio, imparata durante l'addestramento: quali parole e idee stanno insieme.","1"],
["Prompt chaining","Dividere un compito in più prompt in sequenza, usando il risultato di ciascuno per il successivo.","1"],
["Prompt injection","Istruzioni nascoste in un testo o in un file che cercano di cambiare il comportamento del modello.","6"],
["RAG (retrieval-augmented generation)","Il sistema recupera prima i passaggi pertinenti dalle fonti e li passa al modello per rispondere. Riduce le invenzioni, non le elimina.","3"],
["Regolamento europeo sull'IA (AI Act)","Norma europea sull'IA: prevede alfabetizzazione, categorie di rischio e divieti, alcuni riguardanti la scuola.","1"],
["Scatola nera","Sistema di cui si vedono ingressi e uscite ma non si spiega bene il funzionamento interno, come i grandi modelli.","1"],
["Sicofanzia (sycophancy)","Tendenza del modello ad assecondare l'utente e a dargli ragione anche quando sbaglia.","1"],
["Temperatura","Parametro che regola quanto il modello può scegliere parole meno probabili: bassa per coerenza, alta per varietà e fantasia. Non rende il modello più intelligente.","1, 6"],
["Token","Unità di testo in cui il modello divide parole e frasi. Limiti di lunghezza e alcuni errori (contare lettere, calcoli lunghi) dipendono da qui.","1"],
["UDL (Universal Design for Learning)","Progettazione per tutti: più modi di rappresentare i contenuti, di esprimere ciò che si è capito e di coinvolgere.","3"],
["Verifica incrociata","Controllo di un'informazione confrontando più fonti indipendenti.","5"],
["Zona di sviluppo prossimale","Distanza tra ciò che lo studente sa fare da solo e ciò che sa fare con aiuto (Vygotskij): l'ambito dello scaffolding.","1"],
["Addestramento","Fase in cui un modello apprende da grandi quantità di dati, riconoscendo regolarità nel linguaggio.","1"],
["AI Literacy","Alfabetizzazione sull'IA: capire come funziona, usarla bene, valutarla in modo critico e con responsabilità.","1"],
["Allucinazione","Risposta plausibile e sicura nel tono, ma falsa: dati alterati, citazioni o fonti inesistenti.","1, 5"],
["Audio Overview (panoramica audio)","Traccia audio generata da NotebookLM a partire dalle fonti caricate, in forma di conversazione o di ripasso guidato.","4"],
["Autovalutazione","Verifica che lo studente fa da solo sulla propria preparazione, con quiz, flashcard o domande di controllo.","4"],
["BES (Bisogni Educativi Speciali)","Situazioni che richiedono strategie didattiche personalizzate. Il materiale può essere adattato nella forma, non nei contenuti.","3"],
["Bias","Squilibrio ereditato dai dati di addestramento che orienta le risposte, ad esempio stereotipi o prevalenza di certe fonti.","1"],
["Caccia all'errore","Attività in cui gli studenti cercano e classificano errori nascosti in un testo, per allenare il senso critico.","2, 5"],
["Canvas (Gemini Canvas)","Spazio dentro Gemini in cui la conversazione diventa un artefatto interattivo: quiz, giochi, flashcard, escape room.","2"],
["Chat","Modalità di conversazione con l'IA, a domanda e risposta, senza un artefatto interattivo.","1"],
["Citazione (nelle fonti)","Rimando che indica il punto esatto della fonte da cui proviene un'affermazione, in NotebookLM cliccabile.","3"],
["Collaudo","Prova di un tutor con studenti finti (che sa, che sbaglia, che chiede la soluzione) prima di consegnarlo.","6"],
["Compito","Elemento del prompt che dice che cosa fare, in passi chiari.","1"],
["Contesto","Elemento del prompt che descrive la situazione: chi è lo studente, che cosa sa, dove fatica.","1"],
["Deep Research","Funzione di Gemini che esegue ricerche approfondite su più fonti e produce un report con riferimenti.","5"],
["Dialogo socratico","Modo di guidare l'apprendimento con domande, senza dare subito la risposta, perché lo studente scopra il concetto.","1, 6"],
["DigCompEdu","Quadro europeo delle competenze digitali dei docenti, articolato in aree.","Corso"],
["Distrattore","Opzione sbagliata di un quiz a risposta multipla. Un buon distrattore rappresenta un errore reale.","4"],
["DSA (Disturbi Specifici dell'Apprendimento)","Difficoltà come dislessia, disortografia, discalculia. Il materiale si adatta nella forma mantenendo i concetti.","3"],
["Ecosistema Gemini","L'insieme di strumenti usati nel corso: Gemini, Canvas, NotebookLM, Google AI Studio e, come opzione, Storybook.","Corso"],
["Escape room didattica","Attività a stanze in cui ogni enigma è un concetto della materia, con indizi progressivi.","2"],
["Fact-checking","Verifica dell'esattezza di un'affermazione controllando le fonti originali.","5"],
["Feedback immediato","Risposta che lo studente riceve subito dopo ogni tentativo, che riduce l'ansia e guida la correzione.","2"],
["Few-shot","Tecnica di prompting in cui si forniscono uno o più esempi del risultato atteso.","1"],
["Finestra di contesto","Quantità di testo che il modello considera in una conversazione. Oltre quel limite, dettagli si perdono.","1"],
["Flashcard","Scheda con una domanda sul fronte e la risposta sul retro, per il richiamo attivo.","2, 4"],
["Fonte","Materiale da cui si ricava un'informazione: libro, articolo, documento. La sua qualità determina quella della risposta.","3, 5"],
["Formato","Elemento del prompt che stabilisce come presentare la risposta: tabella, elenco, sezioni.","1"],
["Gamification","Uso di meccaniche di gioco (punteggi, livelli, indizi) per ingaggiare gli studenti.","2"],
["Gem","Assistente personalizzato di Gemini, con istruzioni salvate che valgono per ogni conversazione.","1, 6"],
["Gemini","Assistente di intelligenza artificiale di Google, usato nel corso per conversare, creare e cercare.","1"],
["Gemini Storybook","Funzione di Gemini per creare storie illustrate con narrazione vocale. Opzionale nel corso.","Corso"],
["Glossario (di NotebookLM)","Elenco di termini chiave estratti dalle fonti, con definizioni ancorate ad esse.","3"],
["Google AI Studio","Ambiente di Google per sperimentare con i modelli: istruzioni di sistema, parametri e app più articolate.","2, 6"],
["Guida allo studio","Riassunto strutturato con domande di verifica generato da NotebookLM.","3"],
["Infografica","Rappresentazione visiva di dati e relazioni, generabile da NotebookLM.","3"],
["Istruzioni di sistema (system instructions)","Regole permanenti che definiscono ruolo, metodo e limiti di un assistente.","6"],
["Learning by Doing","Metodo che fa imparare facendo: ogni lezione è laboratoriale.","Corso"],
["Learning path","Percorso di apprendimento in più tappe, ad esempio 5 giorni con quiz diagnostico, canvas di approfondimento e quiz finale.","2"],
["LLM (modello linguistico di grandi dimensioni)","Sistema addestrato su enormi quantità di testo che genera linguaggio prevedendo il seguito più probabile.","1"],
["Mappa mentale","Schema che rappresenta concetti e relazioni, generabile da NotebookLM.","3"],
["Memoria episodica e semantica","Episodica: ricordare la sequenza di ciò che si è letto. Semantica: ricordare il significato. Per imparare servono entrambe.","4"],
["Metacognizione","Pensare al proprio modo di pensare: sapere che cosa si sa e dove ci sono lacune.","4"],
["Multimodale","Che lavora con più formati insieme: testo, immagini, audio.","1, 4"],
["Non deterministico","Che a parità di domanda può dare risposte diverse.","1"],
["NotebookLM","Strumento di Google che lavora sulle fonti caricate e le trasforma in risposte con citazioni, mappe, glossari e audio.","3"],
["PDP (Piano Didattico Personalizzato)","Documento che stabilisce strumenti e misure compensative per uno studente. La scelta finale spetta al docente.","3"],
["Pianificatore di Studio","Primo Gem del corso: organizza il lavoro scolastico in blocchi, giorni e sessioni.","1"],
["Privacy","Tutela dei dati personali: non inserire nomi reali, valutazioni, diagnosi o elaborati identificabili nei prompt.","1"],
["Prompt","La richiesta scritta al modello.","1"],
["Prompt Engineering","Insieme delle tecniche per scrivere prompt efficaci: contesto, ruolo, compito, vincoli e formato.","1"],
["Prompt Kit","Raccolta personale di prompt riutilizzabili, salvata in un documento.","1"],
["Richiamo attivo (active recall)","Recuperare un'informazione dalla memoria senza guardare la risposta. È più efficace del rileggere.","4"],
["Ripetizione dilazionata (spaced repetition)","Ripassare a intervalli crescenti, ad esempio il giorno stesso, dopo 3, 7 e 30 giorni.","4"],
["Ruolo","Elemento del prompt che dice all'IA chi deve essere: tutor, coach, revisore.","1"],
["Scaffolding","Supporto temporaneo che guida lo studente e si toglie man mano: passi piccoli, esempi, domande guida, rinforzo.","1, 2"],
["Simulatore di ruolo","Attività in cui lo studente interpreta un ruolo e prende decisioni con conseguenze e punteggi.","2"],
["Source-grounded","Che risponde a partire dalle fonti fornite e le cita, riducendo le allucinazioni.","3"],
["Specchio metacognitivo","Prompt che aiuta lo studente ad analizzare come ha sbagliato e di che tipo è la sua lacuna.","4"],
["Storia a bivio","Racconto interattivo in cui le scelte dello studente portano a conseguenze diverse.","2"],
["Studente-tipo","Studente di riferimento usato nelle demo, «Marco»: personalizzato poi con studenti reali anonimizzati.","1"],
["Studio multimodale","Studio con più canali: lettura, ascolto, quiz, schemi.","4"],
["Tassonomia di Bloom","Scala di livelli cognitivi: ricordare, comprendere, applicare, analizzare, valutare, creare.","2"],
["Tutor socratico","Tutor virtuale che pone domande guida anziché dare le soluzioni.","1, 6"],
["Tutor virtuale","Assistente configurato per accompagnare lo studente nello studio autonomo.","6"],
["Vincoli","Elemento del prompt che stabilisce limiti e cosa non fare.","1"],
["Zero-shot","Tecnica di prompting senza esempi: si chiede direttamente.","1"]
];
try {
  var pos = JSON.parse(sessionStorage.getItem("posizione") || "null");
  if (pos && pos.l && pos.s) {
    var back = document.getElementById("back");
    back.href = "lezione-" + pos.l + ".html#" + pos.s;
    back.textContent = "← Torna alla Lezione " + pos.l + ", slide " + pos.s;
    back.hidden = false;
  }
} catch (e) {}
T.sort(function(a,b){ return a[0].localeCompare(b[0], "it"); });
function ini(s){ var c = s.charAt(0).toUpperCase(); return c; }
function render(filter){
  var f = (filter || "").toLowerCase().trim();
  var list = T.filter(function(t){ return !f || (t[0] + " " + t[1]).toLowerCase().indexOf(f) !== -1; });
  var out = "", cur = "";
  list.forEach(function(t){
    var c = ini(t[0]);
    if (c !== cur) { if (cur) out += "</dl>"; out += '<h2 id="l-' + c + '">' + c + "</h2><dl>"; cur = c; }
    out += "<div><dt>" + t[0] + "<small>" + (t[2] === "Corso" ? "Corso" : "Lezione " + t[2]) + "</small></dt><dd>" + t[1] + "</dd></div>";
  });
  if (cur) out += "</dl>";
  document.getElementById("gl").innerHTML = out || "<p>Nessun termine trovato.</p>";
  document.getElementById("cnt").textContent = list.length + " di " + T.length + " termini";
  var letters = {};
  list.forEach(function(t){ letters[ini(t[0])] = 1; });
  document.getElementById("az").innerHTML = Object.keys(letters).map(function(l){ return '<a href="#l-' + l + '">' + l + "</a>"; }).join("");
}
document.getElementById("q").addEventListener("input", function(e){ render(e.target.value); });
render("");
</script>
</body>
